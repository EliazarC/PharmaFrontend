<section class="page">
  <header class="page-header">
    <div><h2>{{ esEdicion() ? 'Editar producto' : 'Nuevo producto' }}</h2><p class="ayuda">Complete los datos del catálogo.</p></div>
    <a routerLink="/productos" class="btn">Volver</a>
  </header>
  @if (error()) { <div class="alerta" role="alert">{{ error() }}</div> }
  <form class="card formulario-producto" [formGroup]="form" (ngSubmit)="guardar()">
    <label>Nombre
      <input class="input" formControlName="nombre" maxlength="120" />
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) { <small class="error">Ingrese un nombre de al menos 2 caracteres.</small> }
    </label>
    <label>Descripción<textarea class="input" formControlName="descripcion" rows="3"></textarea></label>
    <label>Categoría
      <select class="input" formControlName="categoriaId">
        <option [ngValue]="0">Seleccione una categoría</option>
        @for (c of categorias(); track c.id) { <option [ngValue]="c.id">{{ c.nombre }}</option> }
      </select>
    </label>
    <div class="campos-producto">
      <label>Precio (S/)
        <input class="input" type="number" min="0.01" step="0.01" formControlName="precio" />
      </label>
      <label>Stock
        <input class="input" type="number" min="0" step="1" formControlName="stock" />
      </label>
    </div>
    <label class="estado-producto"><input type="checkbox" formControlName="estado" /> Producto activo</label>
    <div class="acciones-formulario">
      <a routerLink="/productos" class="btn">Cancelar</a>
      <button class="btn btn-primary" type="submit" [disabled]="guardando()">{{ guardando() ? 'Guardando…' : 'Guardar producto' }}</button>
    </div>
  </form>
</section>
