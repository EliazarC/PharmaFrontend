<section class="card">
  <h3>Productos más vendidos</h3>
  <table class="tabla">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Categoría</th>
        <th>Cantidad</th>
        <th>Monto</th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.productoId) {
        <tr>
          <td>{{ fila.productoNombre }}</td>
          <td>{{ fila.categoriaNombre }}</td>
          <td>{{ fila.cantidadVendida }}</td>
          <td>{{ fila.montoTotal | currency: 'PEN' : 'S/ ' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Aún no hay ventas registradas.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
