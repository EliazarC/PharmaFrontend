services:
  redis:
    image: redis:7-alpine
    container_name: pharma-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    image: nginx:1.27-alpine
    container_name: pharma-web
    ports:
      - "8081:80"
    volumes:
      - ../dist/pharma-frontend/browser:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "backend:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
